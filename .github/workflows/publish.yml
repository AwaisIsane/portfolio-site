name: publish-to-github-pages
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Prepare site 📦
        run: |
          mkdir -p out
          cp index.html out/
          touch out/.nojekyll
          [ -f public/robots.txt ] && cp public/robots.txt out/ || true
          [ -f Awais-Isane-Resume.pdf ] && cp Awais-Isane-Resume.pdf out/ || true

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          repository-name: AwaisIsane/awaisisane.github.io
          branch: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}
